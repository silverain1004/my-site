<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쓸모없는 웹사이트 콘테스트</title>
<meta name="description" content="수강생들이 만든 쓸모없는 웹사이트 모음. 버튼을 누르면 아무 데나 데려다 드립니다.">
<meta name="theme-color" content="#ffe14d">
<style>
  :root {
    --bg: #ffe14d;
    --ink: #1a1a1a;
    --paper: #fffdf5;
    --accent: #ff4d6d;
    --accent-dark: #c9184a;
    --muted: #5c5540;
    --shadow: 4px 4px 0 var(--ink);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
    -webkit-tap-highlight-color: transparent;
  }
  body.modal-open { overflow: hidden; }

  /* ---------- 히어로 ---------- */
  .hero {
    min-height: 88vh;
    min-height: 88dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: calc(32px + env(safe-area-inset-top)) 16px 32px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--paper);
    font-size: 13px;
    font-weight: 700;
    transform: rotate(-3deg);
  }
  h1 {
    font-size: clamp(32px, 9vw, 64px);
    line-height: 1.15;
    font-weight: 900;
    letter-spacing: -0.03em;
  }
  h1 .strike { position: relative; display: inline-block; }
  h1 .strike::after {
    content: "";
    position: absolute;
    left: -4%; right: -4%; top: 52%;
    height: 0.12em;
    background: var(--accent);
    transform: rotate(-4deg);
  }
  .sub { font-size: clamp(15px, 4vw, 18px); color: var(--muted); max-width: 28em; }

  .random-btn {
    position: relative;
    width: min(240px, 64vw);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 4px solid var(--ink);
    background: radial-gradient(circle at 35% 30%, #ff8fa3, var(--accent) 55%, var(--accent-dark));
    color: #fff;
    font: inherit;
    font-size: clamp(22px, 6.5vw, 30px);
    font-weight: 900;
    line-height: 1.2;
    text-shadow: 2px 2px 0 rgba(0,0,0,.35);
    box-shadow: 0 10px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    touch-action: manipulation;
    user-select: none;
  }
  .random-btn small { display: block; font-size: 0.5em; font-weight: 700; opacity: .9; margin-top: 4px; }
  .random-btn:hover { transform: translateY(-2px) rotate(-2deg); box-shadow: 0 12px 0 var(--ink); }
  .random-btn:active { transform: translateY(8px); box-shadow: 0 2px 0 var(--ink); }
  .random-btn:focus-visible { outline: 4px dashed var(--ink); outline-offset: 8px; }
  .random-btn.spin { animation: wobble .5s ease-in-out; }
  @keyframes wobble {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(-12deg) scale(1.05); }
    40% { transform: rotate(10deg) scale(.97); }
    60% { transform: rotate(-6deg); }
    80% { transform: rotate(4deg); }
  }

  .status { min-height: 1.5em; font-size: 14px; font-weight: 700; color: var(--muted); }
  .scroll-hint {
    margin-top: 6px;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 2px;
  }

  .hero-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; }

  /* ---------- 명예의 전당 ---------- */
  .hall {
    position: relative;
    overflow: hidden;
    background: var(--ink);
    color: #fff;
    border-top: 4px solid var(--ink);
    padding: 48px 16px 56px;
  }
  .hall::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,225,77,.07) 0 10deg, transparent 10deg 20deg);
    animation: rays 40s linear infinite;
    pointer-events: none;
  }
  @keyframes rays { to { transform: rotate(360deg); } }
  .hall > * { position: relative; }
  .hall-head { max-width: 1080px; margin: 0 auto 32px; text-align: center; }
  .hall-head h2 { font-size: clamp(28px, 7vw, 42px); font-weight: 900; letter-spacing: -0.02em; color: var(--bg); }
  .hall-head p { color: #c9c3a8; font-size: 15px; margin-top: 4px; }

  .podium {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: end;
    gap: 16px;
    list-style: none;
  }
  .podium li { display: flex; flex-direction: column; align-items: stretch; }
  .podium .r1 { order: 2; }
  .podium .r2 { order: 1; }
  .podium .r3 { order: 3; }
  .winner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 20px 14px 16px;
    background: #fff;
    color: var(--ink);
    border: 3px solid var(--bg);
    border-radius: var(--radius) var(--radius) 0 0;
    text-align: center;
  }
  .medal { font-size: 44px; line-height: 1; }
  .r1 .medal { font-size: 60px; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(6deg); } }
  .winner h3 { font-size: 18px; font-weight: 900; line-height: 1.3; }
  .r1 .winner h3 { font-size: 22px; }
  .winner .by { margin-bottom: 6px; }
  .winner .actions { width: 100%; flex-wrap: wrap; }
  .winner .btn { min-width: 0; font-size: 14px; padding: 8px 10px; }
  .step {
    display: grid;
    place-items: center;
    font-size: 40px;
    font-weight: 900;
    color: var(--ink);
    border: 3px solid var(--bg);
    border-top: none;
  }
  .r1 .step { height: 140px; background: linear-gradient(#ffe14d, #f5b700); font-size: 56px; }
  .r2 .step { height: 96px; background: linear-gradient(#f1f1f1, #b9b9b9); }
  .r3 .step { height: 64px; background: linear-gradient(#f3c79b, #c98a4b); }

  .rank-tag {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    background: var(--bg);
    font-size: 11px;
    font-weight: 800;
    vertical-align: 2px;
  }
  .card.ranked { border-width: 3px; box-shadow: 4px 4px 0 var(--accent); }

  /* ---------- 갤러리 ---------- */
  .gallery-wrap {
    background: var(--paper);
    border-top: 4px solid var(--ink);
    padding: 40px 16px calc(48px + env(safe-area-inset-bottom));
  }
  .gallery-head { max-width: 1080px; margin: 0 auto 24px; }
  .gallery-head h2 { font-size: clamp(24px, 6vw, 34px); font-weight: 900; letter-spacing: -0.02em; }
  .gallery-head p { color: var(--muted); font-size: 15px; margin-top: 4px; }

  .grid {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
    list-style: none;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 18px;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform .12s;
  }
  .card:hover { transform: translate(-2px, -2px) rotate(-.4deg); }
  .card-top { display: flex; align-items: center; gap: 12px; }
  .emoji {
    flex: none;
    width: 52px; height: 52px;
    display: grid; place-items: center;
    font-size: 28px;
    border: 2px solid var(--ink);
    border-radius: 12px;
    background: var(--c, #ffe14d);
  }
  .num { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .05em; }
  .card h3 { font-size: 18px; font-weight: 800; line-height: 1.3; }
  .by { font-size: 13px; color: var(--muted); }
  .teaser {
    font-size: 14px;
    color: #333;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn {
    flex: 1;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 12px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .06s, box-shadow .06s;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .btn-go { background: var(--ink); color: #fff; }
  .btn-info { background: var(--paper); color: var(--ink); }

  /* ---------- 모달 ---------- */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(20, 18, 10, .55);
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s, visibility .2s;
  }
  .modal.open { opacity: 1; visibility: visible; }
  .sheet {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 86vh;
    max-height: 86dvh;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 18px;
    box-shadow: 6px 6px 0 var(--ink);
    transform: translateY(20px) scale(.97);
    transition: transform .22s cubic-bezier(.2,.9,.3,1.2);
  }
  .modal.open .sheet { transform: none; }
  .sheet-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 56px 14px 20px;
    border-bottom: 2px dashed #ddd;
  }
  .sheet-head h3 { font-size: 20px; font-weight: 900; line-height: 1.3; }
  .sheet-body {
    padding: 16px 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    font-size: 16px;
    line-height: 1.75;
    white-space: pre-line;
  }
  .sheet-body strong { background: linear-gradient(transparent 60%, #ffe14d 60%); }
  .sheet-foot { padding: 14px 20px 20px; display: flex; gap: 8px; }
  .close {
    position: absolute;
    top: 12px; right: 12px;
    width: 40px; height: 40px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    background: var(--paper);
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
  }

  footer { text-align: center; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); }
  footer a { color: inherit; }

  /* 모바일: 모달을 바텀시트로 */
  @media (max-width: 600px) {
    .modal { align-items: flex-end; padding: 0; }
    .sheet {
      max-width: none;
      max-height: 90vh;
      max-height: 90dvh;
      border-radius: 20px 20px 0 0;
      border-bottom: none;
      box-shadow: 0 -4px 0 var(--ink);
      transform: translateY(100%);
      transition: transform .25s ease-out;
    }
    .sheet::before {
      content: "";
      display: block;
      width: 44px; height: 5px;
      margin: 10px auto 0;
      border-radius: 3px;
      background: #ccc;
    }
    .sheet-foot { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .grid { grid-template-columns: 1fr; gap: 14px; }

    /* 모바일 명예의 전당: 1→2→3 세로 순서, 단상은 왼쪽 띠로 */
    .podium { grid-template-columns: 1fr; gap: 14px; }
    .podium .r1, .podium .r2, .podium .r3 { order: 0; }
    .podium li { flex-direction: row; }
    .podium .step { order: -1; width: 56px; height: auto !important; font-size: 28px !important; border: 3px solid var(--bg); border-right: none; border-radius: var(--radius) 0 0 var(--radius); }
    .winner { flex: 1; border-radius: 0 var(--radius) var(--radius) 0; padding: 16px 14px; }
    .r1 .winner { padding: 22px 14px; }
    .card { padding: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="hero">
  <span class="badge">🏆 쓸모없는 웹사이트 콘테스트</span>
  <h1>세상에서 가장<br><span class="strike">쓸모있는</span> 쓸모없는<br>버튼</h1>
  <button class="random-btn" id="randomBtn" type="button">
    TAKE ME!
    <small>somewhere useless</small>
  </button>
  <p class="status" id="status" aria-live="polite"></p>
</header>

<section class="hall" id="hall">
  <div class="hall-head">
    <h2>🏆 명예의 전당</h2>
    <p>가장 쓸모없음을 인정받은 영광의 작품들</p>
  </div>
  <ol class="podium" id="podium"></ol>
</section>

<main class="gallery-wrap" id="gallery">
  <div class="gallery-head">
    <h2>📂 출품작 갤러리</h2>
    <p>‘바로 가기’는 바로 이동, ‘설명 보기’는 작품 설명을 띄웁니다.</p>
  </div>
  <ul class="grid" id="grid"></ul>
</main>

<footer>
  Inspired by <a href="https://theuselessweb.com/" target="_blank" rel="noopener">The Useless Web</a>
</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" type="button" aria-label="닫기">✕</button>
    <div class="sheet-head">
      <div class="emoji" id="mEmoji"></div>
      <div>
        <div class="num" id="mNum"></div>
        <h3 id="mTitle"></h3>
        <div class="by" id="mBy"></div>
      </div>
    </div>
    <div class="sheet-body" id="mBody"></div>
    <div class="sheet-foot">
      <a class="btn btn-go" id="mGo" target="_blank" rel="noopener">사이트로 가기 →</a>
    </div>
  </div>
</div>

<script>
  // 출품작을 추가하려면 이 배열에 항목을 하나 더 넣으면 됩니다.
  const SITES = [
    {
      author: "웅이피리",
      realName: "백현규",
      name: "이름 닮은 동물",
      emoji: "🦊",
      color: "#ffd6a5",
      desc: "이름을 입력하면 연상되는 동물이미지를 보여줍니다.",
      url: "https://bujigi.github.io/my-site/"
    },
    {
      author: "곧점심",
      realName: "정민현",
      name: "점심먹자",
      emoji: "🍱",
      color: "#caffbf",
      desc: "곧 점심시간입니다 신나요 히히",
      url: "https://09and07.github.io/lunch/"
    },
    {
      author: "럭키걸",
      realName: "박하윤",
      name: "이번엔 진짜 될 것 같아",
      emoji: "🎟️",
      color: "#fdffb6",
      desc: "[쓸데없는 즉석복권] 진짜 복권 긁는 두근거림은 그대로인데, 당첨되면 아무 쓸모 없는 상품을 주는 사이트입니다. 사용법은 간단합니다. 화면 가운데 복권 카드의 은색 칸 6개를 마우스나 손가락으로 문지르면 사각사각 소리와 함께 그림이 나오고, 같은 그림 3개가 나오면 1등입니다. 1등 확률이 무려 40%라 자주 당첨되는데, 마지막 한 칸이 남았을 때 같은 그림이 2개 나와 있으면 화면이 어두워지고 심장 소리가 \"두근… 두근…\" 울리며 긴장감이 최고조에 달합니다. 1등에 당첨되면 화면 가득 폭죽이 터지고 \"1등 당첨!!!\"과 함께 상품이 공개되는데, 바로 여기가 하이라이트입니다. \"동네 비둘기 한 마리의 존중\", \"아무도 모르게 잘생겨짐 (본인도 모름)\", \"내일 알람 5분 연장권 (효력 없음)\", \"냉장고를 열었을 때 원하는 게 있을 확률 +1%\" 같은 쓸데없는 상품이 랜덤으로 나오고, 실제 지급액은 억 단위 숫자가 돌아가다가 결국 0원에 멈춥니다. 꽝이 나와도 \"꽝 상품: 1등 상품과 동일함\"이라서 사실상 모두가 1등입니다. 당첨 횟수가 쌓이면 \"복권 회사가 당신을 두려워하기 시작했습니다\" 같은 추가 멘트도 나오니, 몇 장 연속으로 긁어보시면서 어떤 상품이 나오는지 꼭 확인해 보세요! (화면 상단의 누적 당첨금은 언제나 0원입니다)",
      url: "https://parkhayun42.github.io/mysite/"
    },
    {
      author: "말랑마스터",
      realName: "노은선",
      rank: 2,
      name: "말랑이 괴롭히기",
      emoji: "🫠",
      color: "#ffc6ff",
      desc: "말랑이를 괴롭힐 수 있는 사이트입니다! 잡아당기거나, 빙빙 돌리거나, 튕길 수 있습니다.",
      url: "https://mwohye.github.io/test_index"
    },
    {
      author: "건강이최고",
      realName: "배대웅",
      rank: 1,
      name: "절대 누르지 마시오",
      emoji: "🔴",
      color: "#ffadad",
      desc: "안녕하세요. 제가 만든 사이트는 **「절대 누르지 마시오」**입니다.\n\n화면에는 아무 기능이 없는 빨간 버튼 하나만 있습니다. 누르지 말라고 쓰여 있는데, 사람은 그러면 꼭 누르게 되죠.\n\n누를 때마다 버튼이 서운해하면서 작아지고, 그다음에는 도망을 다닙니다. 잡고 나면 버튼 기능을 불러오는 로딩이 99%까지 갔다가 거꾸로 떨어지고, \"기능을 찾지 못했습니다. 원래 없었습니다\"라는 말이 나옵니다.\n\n그 뒤로는 아무것도 없는 칸을 모두 고르라는 캡차, 끝까지 읽어야 체크되는 약관, 16개 중에 진짜 버튼 찾기, 5초 꾹 누르기가 이어집니다. 꾹 누르기는 거의 다 됐을 때 한 번 미끄러집니다.\n\n마지막 질문에서는 \"아니오\"를 눌러도 \"예\"로 처리됩니다.\n\n9단계를 다 깨면 낭비한 시간과 누른 횟수로 C급부터 **S급 '전설의 잉여인간'**까지 등급을 매긴 쓸모없음 인증서를 드립니다.\n\n휴대폰으로도 잘 되니까 지금 바로 해보시고, 누가 시간을 제일 많이 낭비했는지 겨뤄보세요. 감사합니다!",
      url: "https://woongaga.github.io/test-website/"
    },
    {
      author: "밍구",
      realName: "심다인",
      name: "점메추",
      emoji: "🍜",
      color: "#9bf6ff",
      desc: "점심 메뉴 뭐 먹을 지 고민된다면 사용하는 앱",
      url: "https://shiningshim.github.io/random_lunch/"
    },
    {
      author: "배고파요",
      realName: "김총비",
      rank: 3,
      name: "야옹이네",
      emoji: "🐱",
      color: "#bdb2ff",
      desc: "고양이 미용실 게임",
      url: "https://owol-9-9.github.io/claude-site-01/"
    }
  ];

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  // "**굵게**" 표기를 <strong>으로 바꿔 안전하게 붙인다 (innerHTML 사용 안 함)
  function renderRich(el, text) {
    el.textContent = "";
    text.split("**").forEach((part, i) => {
      if (!part) return;
      if (i % 2) {
        const s = document.createElement("strong");
        s.textContent = part;
        el.appendChild(s);
      } else {
        el.appendChild(document.createTextNode(part));
      }
    });
  }
  const byline = (site) => "by " + site.author + (site.realName ? ` (${site.realName})` : "");
  const plain = (text) => text.replace(/\*\*/g, "").replace(/\s+/g, " ");

  const MEDALS = { 1: "🥇", 2: "🥈", 3: "🥉" };
  function addRankTag(el, rank) {
    if (!MEDALS[rank]) return;
    const tag = document.createElement("span");
    tag.className = "rank-tag";
    tag.textContent = `${MEDALS[rank]} ${rank}등`;
    el.appendChild(tag);
  }

  // ---------- 명예의 전당 ----------
  const podium = $("podium");
  SITES.map((site, i) => ({ site, i }))
    .filter(({ site }) => MEDALS[site.rank])
    .sort((a, b) => a.site.rank - b.site.rank)
    .forEach(({ site, i }) => {
      const li = document.createElement("li");
      li.className = "r" + site.rank;
      li.innerHTML = `
        <div class="winner">
          <div class="medal"></div>
          <h3></h3>
          <div class="by"></div>
          <div class="actions">
            <a class="btn btn-go" target="_blank" rel="noopener">바로 가기 →</a>
            <button class="btn btn-info" type="button">설명 보기</button>
          </div>
        </div>
        <div class="step"></div>`;
      li.querySelector(".medal").textContent = MEDALS[site.rank];
      li.querySelector("h3").textContent = site.name;
      li.querySelector(".by").textContent = byline(site);
      li.querySelector(".step").textContent = site.rank;
      li.querySelector(".btn-go").href = site.url;
      li.querySelector(".btn-info").addEventListener("click", (e) => openModal(i, e.currentTarget));
      podium.appendChild(li);
    });

  // ---------- 갤러리 ----------
  const grid = $("grid");
  SITES.forEach((site, i) => {
    const li = document.createElement("li");
    li.className = "card";
    li.innerHTML = `
      <div class="card-top">
        <div class="emoji"></div>
        <div>
          <div class="num"></div>
          <h3></h3>
          <div class="by"></div>
        </div>
      </div>
      <p class="teaser"></p>
      <div class="actions">
        <a class="btn btn-go" target="_blank" rel="noopener">바로 가기 →</a>
        <button class="btn btn-info" type="button">설명 보기</button>
      </div>`;
    const emoji = li.querySelector(".emoji");
    emoji.textContent = site.emoji;
    emoji.style.setProperty("--c", site.color);
    li.querySelector(".num").textContent = "No." + pad(i + 1);
    li.querySelector("h3").textContent = site.name;
    addRankTag(li.querySelector("h3"), site.rank);
    if (MEDALS[site.rank]) li.classList.add("ranked");
    li.querySelector(".by").textContent = byline(site);
    li.querySelector(".teaser").textContent = plain(site.desc);
    li.querySelector(".btn-go").href = site.url;
    li.querySelector(".btn-info").addEventListener("click", (e) => openModal(i, e.currentTarget));
    grid.appendChild(li);
  });
  if ($("count")) $("count").textContent = SITES.length;

  // ---------- 모달 ----------
  const modal = $("modal");
  let lastFocus = null;

  function openModal(i, trigger) {
    const site = SITES[i];
    lastFocus = trigger || null;
    $("mEmoji").textContent = site.emoji;
    $("mEmoji").style.setProperty("--c", site.color);
    $("mNum").textContent = "No." + pad(i + 1);
    $("mTitle").textContent = site.name;
    addRankTag($("mTitle"), site.rank);
    $("mBy").textContent = byline(site);
    renderRich($("mBody"), site.desc);
    $("mBody").scrollTop = 0;
    $("mGo").href = site.url;
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
    $("mClose").focus();
  }
  function closeModal() {
    if (!modal.classList.contains("open")) return;
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
    if (lastFocus) lastFocus.focus();
  }
  $("mClose").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  // ---------- 랜덤 버튼 ----------
  // 셔플 가방 방식: 한 바퀴 다 돌기 전에는 같은 사이트가 다시 나오지 않는다.
  const BAG_KEY = "useless-bag-v1";

  function loadBag() {
    try {
      const bag = JSON.parse(localStorage.getItem(BAG_KEY));
      if (Array.isArray(bag) && bag.every((n) => Number.isInteger(n) && n >= 0 && n < SITES.length)) return bag;
    } catch (e) {}
    return [];
  }
  function saveBag(bag) {
    try { localStorage.setItem(BAG_KEY, JSON.stringify(bag)); } catch (e) {}
  }
  function shuffled(last) {
    const arr = SITES.map((_, i) => i);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    // 새 바퀴의 첫 사이트가 직전 사이트와 겹치지 않게
    if (arr.length > 1 && arr[arr.length - 1] === last) {
      [arr[0], arr[arr.length - 1]] = [arr[arr.length - 1], arr[0]];
    }
    return arr;
  }
  let lastPicked = -1;
  function nextIndex() {
    let bag = loadBag();
    if (!bag.length) bag = shuffled(lastPicked);
    const idx = bag.pop();
    saveBag(bag);
    lastPicked = idx;
    return idx;
  }

  const btn = $("randomBtn");
  btn.addEventListener("click", () => {
    const site = SITES[nextIndex()];
    // 팝업 차단을 피하려면 클릭 직후 동기적으로 열어야 한다
    // ("noopener" 옵션을 주면 항상 null이 반환돼 차단 여부를 알 수 없으므로 opener를 직접 끊는다)
    // PC에서는 별도 창으로 띄우고 같은 창을 재사용한다. 모바일은 브라우저가 알아서 새 탭으로 연다.
    const w = Math.min(1200, screen.availWidth - 80);
    const h = Math.min(860, screen.availHeight - 80);
    const left = Math.round((screen.availWidth - w) / 2);
    const top = Math.round((screen.availHeight - h) / 2);
    const win = window.open(site.url, "uselessWindow",
      `popup,width=${w},height=${h},left=${left},top=${top}`);
    if (win) { win.opener = null; win.focus(); }
    else location.href = site.url; // 새 창이 막힌 환경이면 현재 탭에서 이동
    $("status").textContent = `${site.emoji} ‘${site.name}’(으)로 보내드렸습니다.`;
    btn.classList.remove("spin");
    void btn.offsetWidth;
    btn.classList.add("spin");
  });
</script>
</body>
</html>
